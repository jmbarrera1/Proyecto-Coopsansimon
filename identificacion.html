
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Consulta</title>
    <title>Pagos en Línea | Coop San Simón</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">  

    <style>
        /* Estilos generales del contenedor */
        .contenedor-principal {
            width: 100%;
            max-width: 550px; /* Aujstar el ancho aquí */
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 100px auto;
        }

        /* Caja del formulario */
        .caja-formulario {
            border: 2px solid #007A33;
            padding: 2px;
            background-color: #ffffff;
        }

        /* Franja superior */
        .encabezado {
            background-color: #007A33;
            color: #ffffff;
            text-align: center;
            font-weight: medium; 
            padding: 8px 10px;
        }

        /* Franja para el título del input */
        .subtitulo {
            background-color: #F3E600;
            color: #000000;
            text-align: center;
            padding: 6px 10px;
            margin-top: 2px;
        }

        /* Área blanca del campo de texto */
        .seccion-input {
            text-align: center;
            padding: 12px;
            background-color: #ffffff;
        }

        /* Estilo del campo de texto */
        .seccion-input input[type="text"] {
            width: 70%;
            padding: 4px;
            border: 2px solid #007A33;
            box-sizing: border-box;
        }

        /* Contenedor del botón para alinearlo a la derecha */
        .seccion-boton {
            text-align: right;
            margin-top: 8px;
        }

        /* Botón con estilo clásico y degradado */
        .boton-continuar {
            background: linear-gradient(to bottom, #007A33, #01743185);
            border: 1px solid #007A33;
            color: #ffffff;
            font-weight: bold;
            padding: 7px 20px;
            cursor: pointer;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

        /* Efecto al pasar el cursor sobre el botón */
        .boton-continuar:hover {
            background: linear-gradient(to bottom, #225537, #40a169);
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div class="caja-formulario">
            <div class="encabezado">
                Cooperativa Sansimon    |   Está accediendo a los servicios de pago

            </div>
            <div class="subtitulo">
                Ingrese su número de identificación   
            </div>
            <div class="seccion-input">
                <input type="text" id="documento" name="documento">
            </div>
        </div>
        <div class="seccion-boton">
            <button class="boton-continuar">Continuar</button>
        </div>
    </div>


    

</body>
</html>
